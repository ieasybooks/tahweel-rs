[package]
name = "tahweel-cli"
description = "Command-line OCR of PDFs and images into TXT, DOCX and JSON with tahweel."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "text-processing"]
include = ["src/**", "docs/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "tahweel"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
dirs.workspace = true
indicatif.workspace = true
reqwest.workspace = true
tahweel = { path = "crates/tahweel", version = "0.0.0" }
tahweel-drive = { path = "crates/tahweel-drive", version = "0.0.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing.workspace = true
usage-rs = { workspace = true, features = ["completions", "response-files"] }
webbrowser.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
image.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
usage-rs = { workspace = true, features = ["test"] }
wiremock.workspace = true
zip.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/tahweel", "crates/tahweel-drive"]
default-members = [".", "crates/tahweel", "crates/tahweel-drive"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ieasybooks/tahweel-rs"
keywords = ["ocr", "pdf", "arabic", "docx", "google-drive"]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
bytes = "1.12.1"
dirs = "7.0.0"
dunce = "1.0.5"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imprimatur = "0.6.1"
indicatif = "0.18.6"
insta = "1.49.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = "1.54.1"
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-general-category = "1.1.0"
unicode-script = "0.5.8"
usage-rs = "7.1.2"
webbrowser = { version = "1.2.5", features = ["hardened"] }
wiremock = "0.6.5"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
