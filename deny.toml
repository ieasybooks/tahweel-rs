# cargo-deny: run `cargo deny check` (installed by `mise install`).

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Every dependency's license must be on this list. Add a license only after checking it is
# compatible with distributing tahweel under MIT.
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
