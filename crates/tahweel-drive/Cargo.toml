[package]
name = "tahweel-drive"
description = "Google Drive OCR recognizer for tahweel, with service-account and OAuth sign-in."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["text-processing", "api-bindings"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
dirs.workspace = true
httpdate.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tahweel = { path = "../tahweel", version = "0.1.0" }
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
